[project]
name = "shree-balaji-couriers-api"
version = "0.1.0"
description = "FastAPI backend for Shree Balaji Couriers shipment tracking"
requires-python = ">=3.11"
dependencies = [
	"argon2-cffi>=23.1,<26",
	"fastapi>=0.115,<1",
	"itsdangerous>=2.2,<3",
	"psycopg[binary]>=3.2,<4",
	"pydantic-settings>=2.7,<3",
	"python-dotenv>=1,<2",
	"sqlalchemy>=2,<3",
	"uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
	"httpx>=0.27,<1",
	"pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]
addopts = "-q"
