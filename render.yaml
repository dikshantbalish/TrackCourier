services:
  - type: web
    name: trackcourier
    runtime: python
    buildCommand: pip install uv && cd backend && uv sync --no-dev --frozen
    startCommand: cd backend && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://shree-balaji-couriers.pages.dev
      - key: ENVIRONMENT
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
